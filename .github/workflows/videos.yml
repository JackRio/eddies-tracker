# Keeps the Home page's videos fresh without the desktop app being open:
# once a day it reads each followed creator's public YouTube RSS
# feed and commits docs/data/videos.json if anything new was uploaded.
# See scripts/fetch-videos.js. Run it on demand from the repo's Actions tab.
name: Update videos

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest videos
        run: node scripts/fetch-videos.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/data/videos.json; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "eddies-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/videos.json
          git commit -m "Update videos"
          git pull --rebase
          git push
