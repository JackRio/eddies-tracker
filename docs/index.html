<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Needed — Eddies</title>
<link rel="icon" href="images/eddies-glyph-yellow.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <img class="app-logo" src="images/eddies-glyph-yellow.png" alt="" />
    <h1><span class="accent">EDDIES</span></h1>
    <nav class="nav-tabs">
      <a href="/" class="active">Needed</a>
      <a href="record.html">Record</a>
    </nav>
  </header>

  <div class="build-info" id="build-info"></div>

  <main>
    <div class="filter-bar">
      <div class="bucket-toggle" id="bucket-toggle">
        <button class="active" data-bucket="main">Main Set</button>
        <button data-bucket="reserve">Reserve Set</button>
      </div>

      <div class="chip-row" id="color-filters"></div>
      <div class="chip-row" id="type-filters"></div>
      <div class="chip-row" id="rarity-filters"></div>

      <select id="set-filter">
        <option value="all">All Sets</option>
      </select>
    </div>

    <div class="result-count" id="result-count"></div>
    <div class="card-grid" id="card-grid"></div>
    <div class="empty-state" id="empty-state" hidden>Nothing needed here — you're all set.</div>
  </main>

  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="needed.js"></script>
</body>
</html>
