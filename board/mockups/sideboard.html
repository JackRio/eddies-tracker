<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sideboarding mock-up</title>
<style>
:root{--bg:#0b0c0e;--panel:#14161a;--line:#2a2d33;--text:#e8e8e8;--mut:#8b9099;--yel:#f5e600;--cyan:#38e1f2;--red:#ff4d5e;--grn:#4ee08a;--cw:104px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:18px 22px}
header{display:flex;align-items:center;gap:18px;margin-bottom:14px}
h1{font-size:20px;letter-spacing:.06em;margin:0}
.rival{display:flex;align-items:center;gap:8px;margin-left:12px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.rival img{width:44px;border-radius:3px;border:1px solid var(--line)}
.right{margin-left:auto;display:flex;align-items:center;gap:16px}
.timer{font-size:20px;font-variant-numeric:tabular-nums}
.done{background:var(--yel);color:#000;border:0;font-weight:700;padding:9px 22px;font-size:15px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);cursor:pointer}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 10px;display:flex;align-items:center;gap:10px}
h2 .n{color:var(--text);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);padding:14px}

/* plans */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-bottom:14px}
.plan{background:#101216;border:1px solid var(--line);padding:10px 12px;cursor:pointer;position:relative;transition:border-color .15s}
.plan:hover{border-color:#4a4f58}
.plan.on{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.plan h3{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.plan .sub{color:var(--mut);font-size:12px;margin:2px 0 8px}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;background:var(--yel);color:#000}
.swaprow{display:flex;align-items:center;gap:6px}
.mini{position:relative;width:40px}
.mini img{width:40px;display:block;border-radius:2px}
.mini b{position:absolute;bottom:-4px;right:-4px;font-size:10px;padding:0 4px;color:#000}
.out b{background:var(--red)}.in b{background:var(--grn)}
.arrow{color:var(--mut);font-size:18px;margin:0 4px}
.plan .apply{position:absolute;top:10px;right:12px;font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:.08em}

/* change strip */
.changes{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:30px;margin-bottom:14px}
.chip{font-size:12px;padding:3px 8px;border:1px solid}
.chip.m{border-color:var(--red);color:var(--red)}.chip.p{border-color:var(--grn);color:var(--grn)}
.reset{margin-left:auto;background:none;border:1px solid var(--line);color:var(--text);padding:5px 12px;cursor:pointer}
.reset:hover{border-color:var(--mut)}
.hint{color:var(--mut);font-size:12px}

/* board */
.board{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--cw) + 14px),1fr));gap:16px 8px}
.side .grid{grid-template-columns:repeat(3,1fr)}
.stack{position:relative;width:var(--cw);aspect-ratio:63/88;cursor:pointer;margin:6px 0 0 0;justify-self:center}
.stack .layer{position:absolute;inset:0;border-radius:5px;background-size:cover;background-position:center;border:1px solid #000;transition:transform .15s}
.stack .l1{transform:translate(5px,-5px);filter:brightness(.55)}
.stack .l2{transform:translate(10px,-10px);filter:brightness(.4)}
.stack:hover .l1{transform:translate(8px,-8px)}
.stack:hover .l2{transform:translate(16px,-16px)}
.stack .top{position:absolute;inset:0;border-radius:5px;background-size:cover;background-position:center;border:1px solid #000;box-shadow:0 4px 10px #0009}
.stack .q{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#000;border:1px solid var(--yel);color:var(--yel);font-weight:700;font-size:12px;padding:0 7px;z-index:3}
.stack .d{position:absolute;top:-8px;left:-6px;font-size:11px;font-weight:700;padding:0 5px;z-index:3;color:#000}
.stack .d.p{background:var(--grn)}.stack .d.m{background:var(--red)}
.stack.sel .top{outline:3px solid var(--cyan);outline-offset:2px}
.stack.target .top{outline:2px dashed var(--cyan);outline-offset:2px}
.stack.zero{opacity:.35}
.stack .name{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:11px;color:var(--mut);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid .cell{padding-bottom:22px;display:flex;justify-content:center}
.swapbar{margin-top:10px;font-size:12px;color:var(--cyan);min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SIDEBOARDING</h1>
    <div class="rival">Rival
      <img src="/card/padre-man-of-the-cross" alt="Padre">
      <img src="/card/v-streetkid" alt="V">
      <img src="/card/adam-smasher-ender-of-legends" alt="Adam Smasher">
    </div>
    <div class="right">
      <span class="timer">⏱ 1:21</span>
      <button class="done">Done</button>
    </div>
  </header>

  <h2>Swap plans</h2>
  <div class="plans" id="plans"></div>

  <div class="changes" id="changes"></div>

  <div class="board">
    <section class="panel">
      <h2>Main deck <span class="n" id="mc"></span></h2>
      <div class="grid" id="main"></div>
    </section>
    <section class="panel side">
      <h2>Sideboard <span class="n" id="sc"></span></h2>
      <div class="grid" id="side"></div>
      <div class="swapbar" id="swapbar"></div>
    </section>
  </div>
</div>
<script>
const C = {
  'detonate':[1,'Detonate'], 'mandibular-upgrade':[1,'Mandibular Upgrade'], 'mantis-blades':[1,'Mantis Blades'],
  'adrenaline-converter':[2,'Adrenaline Converter'], 'arasaka-emergency-radioport':[2,'Arasaka Radioport'],
  'satori-sword-of-saburo':[2,'Satori'], 'sketchy-ripper':[2,'Sketchy Ripper'], 'zetatech-faceplate':[2,'Zetatech Faceplate'],
  'augmented-negotiators':[3,'Augmented Negotiators'], 'dexter-deshawn-one-last-chance':[3,'Dexter DeShawn'],
  'la-llorona-ghost-of-the-past':[3,'La Llorona'], 'live-with-the-aftermath':[3,'Live with the Aftermath'],
  'viktor-vektor-you-might-feel-a-little-pinch':[3,'Viktor Vektor'], 'gorilla-arms':[4,'Gorilla Arms'],
  'meredith-stout-stone-cold-corpo':[4,'Meredith Stout'], 'bootleg-black-sapphire-show':[5,'Bootleg Black Sapphire'],
  'rockn-rockerboy':[5,"Rockn' Rockerboy"], 'johnny-silverhand-never-stop-fighting':[6,'Johnny Silverhand'],
  'offduty-malfini':[4,'Offduty Malfini'], 'maxtac-suppression-team':[5,'MaxTac Suppression Team'],
};
const M0 = {'detonate':2,'mandibular-upgrade':3,'mantis-blades':2,'adrenaline-converter':3,'arasaka-emergency-radioport':2,
  'satori-sword-of-saburo':2,'sketchy-ripper':1,'zetatech-faceplate':3,'augmented-negotiators':2,'dexter-deshawn-one-last-chance':1,
  'la-llorona-ghost-of-the-past':2,'live-with-the-aftermath':3,'viktor-vektor-you-might-feel-a-little-pinch':2,'gorilla-arms':1,
  'meredith-stout-stone-cold-corpo':3,'bootleg-black-sapphire-show':3,'rockn-rockerboy':2,'johnny-silverhand-never-stop-fighting':3};
const S0 = {'dexter-deshawn-one-last-chance':2,'offduty-malfini':2,'maxtac-suppression-team':3};

const PLANS = [
  { id:'gosolo', title:'vs Go Solo', sub:'Stop haste attacks the turn they land', suggested:true,
    swaps:[['rockn-rockerboy','maxtac-suppression-team',2],['gorilla-arms','maxtac-suppression-team',1]] },
  { id:'blockers', title:'vs Big blockers', sub:'Clear a blocker before you swing',
    swaps:[['detonate','offduty-malfini',2]] },
  { id:'gearless', title:'vs Gear-light decks', sub:'Detonate has no targets - race Gigs instead',
    swaps:[['detonate','dexter-deshawn-one-last-chance',2]] },
  { id:'aggro', title:'vs Aggro', sub:'Cheaper defence, fewer slow finishers',
    swaps:[['rockn-rockerboy','maxtac-suppression-team',2],['sketchy-ripper','offduty-malfini',1]] },
];

let M, S, plan = null, selM = null, selS = null;
const img = k => `/card/${k}`;
const $ = id => document.getElementById(id);
const sum = o => Object.values(o).reduce((a,b)=>a+b,0);

function reset(){ M = {...M0}; S = {...S0}; plan = null; selM = selS = null; draw(); }
function swap(o, i, n=1){ n = Math.min(n, M[o]||0, S[i]||0); if(!n) return;
  M[o]-=n; S[i]-=n; M[i]=(M[i]||0)+n; S[o]=(S[o]||0)+n; }

function stackHtml(k, q, base, side){
  const d = q - (base[k]||0), sel = side ? selS===k : selM===k;
  const target = side ? (selM && !selS) : (selS && !selM);
  const layers = Math.min(Math.max(q,1),3);
  let h = `<div class="cell"><div class="stack${sel?' sel':''}${target&&!sel?' target':''}${q===0?' zero':''}" data-k="${k}" data-side="${side?1:0}" title="${C[k][1]}">`;
  for (let i=layers-1;i>=1;i--) h += `<div class="layer l${i}" style="background-image:url(${img(k)})"></div>`;
  h += `<div class="top" style="background-image:url(${img(k)})"></div><span class="q">×${q}</span>`;
  if (d) h += `<span class="d ${d>0?'p':'m'}">${d>0?'+':''}${d}</span>`;
  return h + `<div class="name">${C[k][1]}</div></div></div>`;
}
function grid(o, base, side){
  const keys = Object.keys({...base, ...o}).filter(k => (o[k]||0) > 0 || (base[k]||0) > 0);
  keys.sort((a,b)=>C[a][0]-C[b][0] || C[a][1].localeCompare(C[b][1]));
  return keys.map(k => stackHtml(k, o[k]||0, base, side)).join('');
}
function miniHtml(k, n, cls){ return `<div class="mini ${cls}" title="${C[k][1]}"><img src="${img(k)}"><b>${cls==='out'?'−':'+'}${n}</b></div>`; }
function drawPlans(){
  $('plans').innerHTML = PLANS.map(p => {
    const outs = {}, ins = {};
    p.swaps.forEach(([o,i,n]) => { outs[o]=(outs[o]||0)+n; ins[i]=(ins[i]||0)+n; });
    return `<div class="plan${plan===p.id?' on':''}" data-p="${p.id}">
      <span class="apply">${plan===p.id?'Applied ✓':'Apply'}</span>
      <h3>${p.title}${p.suggested?'<span class="tag">Suggested</span>':''}</h3>
      <div class="sub">${p.sub}</div>
      <div class="swaprow">${Object.entries(outs).map(([k,n])=>miniHtml(k,n,'out')).join('')}
        <span class="arrow">→</span>${Object.entries(ins).map(([k,n])=>miniHtml(k,n,'in')).join('')}</div></div>`;
  }).join('');
}
function draw(){
  drawPlans();
  $('main').innerHTML = grid(M, M0, false);
  $('side').innerHTML = grid(S, S0, true);
  $('mc').textContent = sum(M) + '/40';
  $('sc').textContent = sum(S) + '/7';
  const keys = [...new Set([...Object.keys(M0), ...Object.keys(M)])];
  const diffs = keys.map(k => [k, (M[k]||0)-(M0[k]||0)]).filter(x=>x[1]).sort((a,b)=>a[1]-b[1]);
  $('changes').innerHTML = (diffs.length
    ? diffs.map(([k,d])=>`<span class="chip ${d>0?'p':'m'}">${d>0?'+':'−'}${Math.abs(d)} ${C[k][1]}</span>`).join('')
    : `<span class="hint">No changes - starting list</span>`) + `<button class="reset" id="reset">↺ Reset</button>`;
  $('reset').onclick = reset;
  $('swapbar').textContent = selM ? `Swap out ${C[selM][1]} - pick a sideboard card` :
                             selS ? `Bring in ${C[selS][1]} - pick a main deck card` : '';
}
document.addEventListener('click', e => {
  const p = e.target.closest('.plan');
  if (p) { const was = plan === p.dataset.p; reset(); if (!was) { PLANS.find(x=>x.id===p.dataset.p).swaps.forEach(s=>swap(...s)); plan = p.dataset.p; } draw(); return; }
  const s = e.target.closest('.stack');
  if (!s) return;
  const k = s.dataset.k, side = s.dataset.side === '1';
  if (side) { if (!S[k]) return; selS = selS===k ? null : k; } else { if (!M[k]) return; selM = selM===k ? null : k; }
  if (selM && selS) { swap(selM, selS); selM = selS = null; plan = null; }
  draw();
});
reset();
</script>
</body>
</html>
