<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play · Eddies Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css?v=20261107f">
<link rel="stylesheet" href="play.css?v=20261107f">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ctcg-swap" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 -1.0725 0 0 0.992  0 -1 0 0 0.925  0 -0.0212 0 0 0.0196  0 0 0 1 0"/></filter><linearGradient id="die-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient></svg>

<main class="layout">
  <section class="board-col">
    <div id="table" class="table" hidden></div>
    <div id="empty" class="empty"><p>Pick decks and a bot, then <b>Start game</b>.</p></div>
  </section>

  <!-- right panel: your decision, the log, the bot's thinking, controls -->
  <aside class="side">
    <div class="side-top"><div id="match-info" class="match-info"></div></div>
    <div class="panel info-panel" id="decision-box" hidden>
      <h2 id="decision-title">Your move</h2>
      <div id="decision-prompt" class="prompt"></div>
      <div id="decision" class="choices"></div>
    </div>
    <div class="log-box">
      <h2>Game log</h2>
      <ol id="log" class="log"></ol>
    </div>
    <details class="panel info-panel" id="think-box" hidden>
      <summary><h2>Bot's thinking <span id="think-at" class="sub"></span></h2></summary>
      <div id="think"></div>
    </details>
    <div class="panel" id="watch-box" hidden>
      <div class="watch-ctl">
        <button class="btn" id="w-step" type="button" title="D">Next move</button>
        <button class="btn" id="w-turn" type="button" title="E">Finish turn</button>
        <button class="btn play" id="w-run" type="button" title="S">Auto ▶</button>
      </div>
    </div>
    <div class="side-ctl">
      <label class="pace-row">Bot speed <select id="pace"><option value="step">Step (click each move)</option><option value="vslow">Very slow</option><option value="slow">Slow</option><option value="normal">Normal</option><option value="fast">Fast</option></select></label>
      <span class="snd"><button class="btn" id="snd-btn" type="button">🔊</button><input id="snd-vol" type="range" min="0" max="100" aria-label="Volume"></span>
      <button class="btn" id="undo" type="button" title="Take back your last move (U)" hidden>↶ Undo</button>
      <button class="btn" id="new-game" type="button">New game</button>
      <a class="btn" href="index.html">Replays</a>
    </div>
  </aside>
</main>

<dialog class="setup-dlg" id="setup-box" open>
  <h2>New game</h2>
  <form id="setup" class="setup">
    <label>Mode <select id="mode"><option value="watch">Watch bot vs bot</option><option value="play">I play the bot</option></select></label>
    <fieldset><legend id="p1-label">You</legend>
      <label class="bot-p1" hidden>Bot <select id="bot-p1"></select></label>
      <label>Deck <select id="deck-p1"></select></label></fieldset>
    <fieldset><legend>Opponent</legend>
      <label>Bot <select id="bot-p2"></select></label>
      <label>Deck <select id="deck-p2"></select></label></fieldset>
    <div id="bot-about" class="about"></div>
    <label>First <select id="first"><option value="random">Random</option><option value="p1">You / left bot</option><option value="p2">Opponent</option></select></label>
    <div class="dlg-ctl"><button class="btn" type="button" id="setup-cancel" hidden>Cancel</button><button class="btn primary" type="submit">Start game</button></div>
  </form>
</dialog>

<footer class="timeline" id="timeline" hidden>
  <button class="btn" id="turn-prev" title="Previous turn (Q / Shift+←)">⏮</button>
  <button class="btn" id="step-prev" title="Previous action (A / ←)">◀</button>
  <button class="btn play" id="play" title="Replay from here (S / Space)">▶</button>
  <button class="btn" id="step-next" title="Next action (D / →)">▶︎|</button>
  <button class="btn" id="turn-next" title="Next turn (E / Shift+→)">⏭</button>
  <div class="scrub-wrap"><input id="scrub" type="range" min="0" value="0" aria-label="Timeline"><div id="coach-marks" class="coach-marks"></div></div>
  <span id="counter" class="counter"></span>
</footer>

<div id="zoom" class="zoom" hidden></div>
<dialog id="pile-dialog" class="pile-dialog"><h2 id="pile-title"></h2><div id="pile-cards" class="pile-cards"></div><button class="btn" id="pile-close">Close</button></dialog>

<script src="sfx.js?v=20261107f"></script>
<script src="replay.js?v=20261107f"></script>
<script src="logfmt.js?v=20261107f"></script>
<script src="app.js?v=20261107f"></script>
<script src="live.js?v=20261107f"></script>
</body>
</html>
