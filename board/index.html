<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay · Eddies Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
</head>
<body>
<!-- The official Legend back is yellow on black; non-Legend backs are the same art with yellow and black swapped. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ctcg-swap" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 -1.0725 0 0 0.992  0 -1 0 0 0.925  0 -0.0212 0 0 0.0196  0 0 0 1 0"/></filter></svg>
<header class="top">
  <h1>Replay <b>Board</b></h1>
  <select id="replay-pick" aria-label="Replay file"><option value="">Choose a replay…</option></select>
  <label class="btn file-btn">Open file…<input id="replay-file" type="file" accept=".json,application/json" hidden></label>
  <div id="match-info" class="match-info"></div>
</header>

<main class="layout">
  <section class="board-col">
    <div id="table" class="table" hidden></div>    <div id="empty" class="empty">
      <p>Pick one of your replays above, open a file, or drop a <code>cyberpunk-tcg-sim-replay-*.json</code> here.</p>
    </div>
  </section>

  <!-- left on wide screens; stacks above the log in the right column on narrower ones -->
  <aside class="left">
    <div class="turn-box" id="turn-box"></div>
    <!-- each player: name, clock, Gig race, counts, and their hand fanned -->
    <div class="pblock" id="rival-block"></div>
    <div class="pblock" id="me-block"></div>
    <!-- Replay Coach (board/coach.js): fills the space under the player blocks -->
    <div class="coach-box" id="coach-box" hidden>
      <h2>Coach <span id="coach-sum"></span></h2>
      <ol id="coach" class="coach"></ol>
      <div id="coach-detail" class="coach-detail"></div>
    </div>
  </aside>

  <aside class="side">
    <div class="log-box">
      <h2>Game log</h2>
      <ol id="log" class="log"></ol>
    </div>
  </aside>
</main>

<footer class="timeline" id="timeline" hidden>
  <button class="btn" id="turn-prev" title="Previous turn (Shift+←)">⏮</button>
  <button class="btn" id="step-prev" title="Previous action (←)">◀</button>
  <button class="btn play" id="play" title="Play / pause (Space)">▶</button>
  <button class="btn" id="step-next" title="Next action (→)">▶︎|</button>
  <button class="btn" id="turn-next" title="Next turn (Shift+→)">⏭</button>
  <div class="scrub-wrap"><input id="scrub" type="range" min="0" value="0" aria-label="Timeline"><div id="coach-marks" class="coach-marks"></div></div>
  <span id="counter" class="counter"></span>
</footer>

<div id="zoom" class="zoom" hidden></div>
<dialog id="pile-dialog" class="pile-dialog"><h2 id="pile-title"></h2><div id="pile-cards" class="pile-cards"></div><button class="btn" id="pile-close">Close</button></dialog>

<script src="replay.js"></script>
<script src="logfmt.js"></script>
<script src="app.js"></script>
<script src="coach.js"></script>
</body>
</html>
