<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>My Collection — Eddies</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="collection.css" />
</head>
<body class="collection-body">
  <div class="window-titlebar">
    <div class="window-controls">
      <button id="win-minimize" class="win-btn" title="Minimize">
        <svg viewBox="0 0 12 12"><rect x="1" y="5.4" width="10" height="1.2" fill="currentColor"/></svg>
      </button>
      <button id="win-maximize" class="win-btn" title="Maximize / Restore">
        <svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="win-close" class="win-btn win-btn-close" title="Close">
        <svg viewBox="0 0 12 12"><path d="M1.5 1.5 L10.5 10.5 M10.5 1.5 L1.5 10.5" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>
  </div>
  <header class="collection-header">
    <div class="title-block">
      <img class="app-logo" src="../../build/eddies-glyph-yellow.png" alt="" />
      <h1>MY <span class="accent">COLLECTION</span></h1>
    </div>
    <div class="tabs" id="type-tabs">
      <button class="tab-btn" data-type="All">ALL</button>
      <button class="tab-btn" data-type="Legend">LEGENDS</button>
      <button class="tab-btn" data-type="Unit">UNITS</button>
      <button class="tab-btn" data-type="Gear">GEAR</button>
      <button class="tab-btn" data-type="Program">PROGRAMS</button>
    </div>
    <button id="close-btn" class="btn">Close</button>
  </header>

  <div class="filter-bar" id="filter-bar">
    <span class="filter-bar-label">Show:</span>
    <button class="filter-chip active" data-filter="all">All</button>
    <button class="filter-chip" data-filter="full">Full Set</button>
    <button class="filter-chip" data-filter="partial">Partial</button>
    <button class="filter-chip" data-filter="missing">Missing</button>
    <div class="bucket-toggle" id="bucket-toggle">
      <button class="bucket-toggle-btn active" data-bucket="main">Main Set</button>
      <button class="bucket-toggle-btn" data-bucket="reserve">Reserve Set</button>
    </div>
    <span class="filter-bar-label">Set:</span>
    <select id="set-filter" autocomplete="off">
      <option value="all">All Sets</option>
    </select>
  </div>

  <div class="board-layout">
    <div class="rarity-sidebar" id="rarity-sidebar">
      <button class="rarity-filter-btn" data-rarity="Common" title="Common">
        <span class="rarity-icon rarity-icon-common"></span>
      </button>
      <button class="rarity-filter-btn" data-rarity="Uncommon" title="Uncommon">
        <span class="rarity-icon rarity-icon-uncommon"></span>
      </button>
      <button class="rarity-filter-btn" data-rarity="Rare" title="Rare">
        <span class="rarity-icon rarity-icon-rare"></span>
      </button>
      <button class="rarity-filter-btn" data-rarity="Epic" title="Epic Rare">
        <span class="rarity-icon rarity-icon-epic"></span>
      </button>
      <button class="rarity-filter-btn" data-rarity="Secret" title="Secret Rare">
        <span class="rarity-icon rarity-icon-secret-rare"></span>
      </button>
      <button class="rarity-filter-btn" data-rarity="Iconic" title="Iconic Rare">
        <span class="rarity-icon rarity-icon-iconic-rare"></span>
      </button>
      <button class="rarity-filter-btn" data-rarity="Nova Rare" title="Nova Rare">
        <span class="rarity-icon rarity-icon-nova-rare"></span>
      </button>
    </div>

    <main class="fan-board" id="fan-board">
      <div class="fan-row" data-color="Red">
        <div class="fan-row-label color-Red">RED</div>
        <div class="fan-stack" data-row="Red"></div>
      </div>
      <div class="fan-row" data-color="Blue">
        <div class="fan-row-label color-Blue">BLUE</div>
        <div class="fan-stack" data-row="Blue"></div>
      </div>
      <div class="fan-row" data-color="Green">
        <div class="fan-row-label color-Green">GREEN</div>
        <div class="fan-stack" data-row="Green"></div>
      </div>
      <div class="fan-row" data-color="Yellow">
        <div class="fan-row-label color-Yellow">YELLOW</div>
        <div class="fan-stack" data-row="Yellow"></div>
      </div>
    </main>
  </div>

  <div id="popped-overlay" class="popped-overlay" hidden>
    <button id="popped-prev" class="popped-nav popped-nav-left" title="Previous (Left arrow)">&#10094;</button>
    <div class="popped-card" id="popped-card">
      <img id="popped-img" src="" alt="" />
      <div class="popped-info">
        <div class="popped-name" id="popped-name"></div>
        <div class="popped-subname" id="popped-subname"></div>
        <div class="popped-buckets" id="popped-buckets"></div>
        <div class="popped-meta" id="popped-meta"></div>
        <div class="popped-rarity" id="popped-rarity"></div>
        <div class="popped-rules" id="popped-rules"></div>
      </div>
    </div>
    <button id="popped-next" class="popped-nav popped-nav-right" title="Next (Right arrow)">&#10095;</button>
  </div>

  <script src="collection.js"></script>
</body>
</html>
