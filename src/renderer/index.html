<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Eddies</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="window-titlebar">
    <div class="window-controls">
      <button id="win-minimize" class="win-btn" title="Minimize">
        <svg viewBox="0 0 12 12"><rect x="1" y="5.4" width="10" height="1.2" fill="currentColor"/></svg>
      </button>
      <button id="win-maximize" class="win-btn" title="Maximize / Restore">
        <svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="win-close" class="win-btn win-btn-close" title="Close">
        <svg viewBox="0 0 12 12"><path d="M1.5 1.5 L10.5 10.5 M10.5 1.5 L1.5 10.5" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>
  </div>
  <header class="app-header">
    <div class="title-block">
      <img class="app-logo" src="../../build/eddies-glyph-yellow.png" alt="" />
      <div>
        <h1><span class="accent">EDDIES</span></h1>
        <p class="subtitle">Cyberpunk TCG collection tracker</p>
      </div>
    </div>
    <div class="stats-block" id="stats-block">
      <div class="stat">
        <span class="stat-value" id="stat-owned">0</span>
        <span class="stat-label">Printings Owned</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-complete">0%</span>
        <span class="stat-label">Collection Complete</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-total-copies">0</span>
        <span class="stat-label">Total Copies</span>
      </div>
      <div class="stat-tracking" id="stat-tracking"></div>
    </div>
    <div class="header-actions">
      <span id="last-updated" class="last-updated"></span>
      <div class="header-buttons">
        <button id="save-backup-btn" class="btn">Save</button>
        <button id="publish-site-btn" class="btn">Publish Site</button>
        <button id="collection-view-btn" class="btn">My Collection</button>
        <button id="refresh-btn" class="btn btn-primary">Refresh Card Data</button>
      </div>
      <div id="publish-status" class="publish-status" hidden></div>
    </div>
  </header>

  <div class="app-body">
    <aside class="filters">
      <div class="filter-group">
        <input type="text" id="search-input" placeholder="Search cards..." />
      </div>

      <div class="filter-group">
        <h3>Ownership</h3>
        <select id="ownership-filter">
          <option value="all">All Cards</option>
          <option value="owned">Owned</option>
          <option value="missing">Missing</option>
        </select>
      </div>

      <div class="filter-group">
        <h3>Color</h3>
        <div id="color-filters" class="chip-list"></div>
      </div>

      <div class="filter-group">
        <h3>Type</h3>
        <div id="type-filters" class="chip-list"></div>
      </div>

      <div class="filter-group">
        <h3>Rarity</h3>
        <div id="rarity-filters" class="chip-list"></div>
      </div>

      <div class="filter-group">
        <h3>Set</h3>
        <select id="set-filter">
          <option value="all">All Sets</option>
        </select>
      </div>

      <div class="filter-group">
        <h3>Sort</h3>
        <select id="sort-select">
          <option value="default">Default (Color / Type / Cost)</option>
          <option value="name">Name (A-Z)</option>
          <option value="cost">Cost (Low-High)</option>
          <option value="power">Power (High-Low)</option>
          <option value="rarity">Rarity</option>
        </select>
      </div>

      <div class="filter-group">
        <h3>Saves</h3>
        <div id="backup-list" class="backup-list"></div>
      </div>
    </aside>

    <main class="card-grid-wrapper">
      <div id="result-count" class="result-count"></div>
      <div id="card-grid" class="card-grid"></div>
      <div id="empty-state" class="empty-state" hidden>No cards match your filters.</div>
      <div id="loading-state" class="loading-state">Loading card database...</div>
    </main>
  </div>

  <div id="popped-overlay" class="popped-overlay" hidden>
    <button id="popped-prev" class="popped-nav popped-nav-left" title="Previous (Left arrow)">&#10094;</button>
    <div class="popped-card" id="popped-card">
      <img id="popped-img" src="" alt="" />
      <div class="popped-info">
        <div class="popped-name" id="popped-name"></div>
        <div class="popped-subname" id="popped-subname"></div>
        <div class="popped-meta" id="popped-meta"></div>
        <div class="popped-rarity" id="popped-rarity"></div>
        <div class="popped-owned-controls" id="popped-owned-controls"></div>
        <div class="popped-rules" id="popped-rules"></div>
        <div id="popped-faq"></div>
      </div>
    </div>
    <button id="popped-next" class="popped-nav popped-nav-right" title="Next (Right arrow)">&#10095;</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
